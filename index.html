<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Art Portfolio - Under Construction</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            overflow: hidden;
        }

        .container {
            text-align: center;
            color: white;
        }

        h1 {
            font-size: 3rem;
            font-weight: 300;
            letter-spacing: 0.2em;
            margin-bottom: 1rem;
            animation: slideUp 0.8s ease-out 0.2s both;
        }

        .subtitle {
            font-size: 1.2rem;
            opacity: 0.8;
            letter-spacing: 0.1em;
            animation: slideUp 0.8s ease-out 0.4s both;
        }

        .construction-icon {
            font-size: 5rem;
            margin-bottom: 1rem;
            animation: slideUp 0.8s ease-out 0.1s both, bounce 2s ease-in-out infinite;
        }

        .tools {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 2rem;
            animation: slideUp 0.8s ease-out 0.6s both;
        }

        .tool {
            font-size: 2rem;
            animation: wiggle 1.5s ease-in-out infinite;
        }

        .tool:nth-child(2) {
            animation-delay: 0.3s;
        }

        .tool:nth-child(3) {
            animation-delay: 0.6s;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes bounce {
            0%, 100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-20px);
            }
        }

        @keyframes wiggle {
            0%, 100% {
                transform: rotate(-10deg);
            }
            50% {
                transform: rotate(10deg);
            }
        }

        @media (max-width: 600px) {
            .construction-icon {
                font-size: 4rem;
            }
            h1 {
                font-size: 2rem;
            }
            .subtitle {
                font-size: 1rem;
            }
            .tool {
                font-size: 1.5rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="construction-icon">👷</div>
        <h1>UNDER CONSTRUCTION</h1>
        <p class="subtitle">Art portfolio coming soon</p>
        <div class="tools">
            <span class="tool">🔨</span>
            <span class="tool">🔧</span>
            <span class="tool">⚙️</span>
        </div>
    </div>
</body>
</html>
